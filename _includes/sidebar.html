<aside class="profile" aria-label="博主信息">
  <div class="profile-identity">
    <img class="profile-photo" src="{{ '/assets/images/profile.jpeg' | relative_url }}?v=2" alt="{{ site.author.name | escape }}" width="168" height="168">
    <div>
      <p class="profile-name">{{ site.author.name }}</p>
      <p class="profile-affiliation">{{ site.author.university }}</p>
      <p class="profile-role" lang="en">{{ site.author.role | escape }}</p>
    </div>
  </div>
  <p class="profile-bio" lang="en">{{ site.author.bio | escape }}</p>
  <ul class="profile-links">
    {% if site.author.email %}
      <li><a href="mailto:{{ site.author.email }}"><i class="fa-regular fa-envelope" aria-hidden="true"></i> Email</a></li>
    {% endif %}
    {% if site.author.github %}
      <li><a href="https://github.com/{{ site.author.github }}"><i class="fa-brands fa-github" aria-hidden="true"></i> GitHub</a></li>
    {% endif %}
    <li><a href="{{ '/feed.xml' | relative_url }}"><i class="fa-solid fa-rss" aria-hidden="true"></i> RSS</a></li>
  </ul>
</aside>
