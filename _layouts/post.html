---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title | escape }}</h1>
    <time class="post-meta" datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%Y.%m.%d' }}</time>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>

<script>
  (function () {
    const toc = document.getElementById('post-toc');
    const headings = Array.from(document.querySelectorAll('.post-content :is(h1, h2, h3)'));
    if (!headings.length) return;

    const nav = toc.querySelector('nav');
    const desktop = window.matchMedia('(min-width: 761px)');
    const links = headings.map(function (heading, index) {
      if (!heading.id) {
        let id = 'post-heading-' + (index + 1);
        while (document.getElementById(id)) id += '-';
        heading.id = id;
      }

      const link = document.createElement('a');
      link.href = '#' + encodeURIComponent(heading.id);
      link.className = 'toc-link toc-' + heading.tagName.toLowerCase();
      link.textContent = heading.textContent;
      return link;
    });
    nav.append(...links);
    toc.open = desktop.matches;
    toc.hidden = false;

    // Close the compact directory before the browser follows its section link.
    nav.addEventListener('click', function (event) {
      if (!desktop.matches && event.target.closest('a')) toc.open = false;
    });

    let currentLink;
    let framePending = false;

    function updateActiveLink() {
      framePending = false;
      const headerBottom = document.querySelector('.site-header').getBoundingClientRect().bottom;
      const readingLine = Math.max(0, headerBottom) + 48;
      const index = headings.findLastIndex(function (heading) {
        return heading.getBoundingClientRect().top <= readingLine;
      });
      const link = links[index];
      if (link === currentLink) return;

      currentLink?.removeAttribute('aria-current');
      link?.setAttribute('aria-current', 'location');
      currentLink = link;
    }

    function scheduleUpdate() {
      if (framePending) return;
      framePending = true;
      window.requestAnimationFrame(updateActiveLink);
    }

    window.addEventListener('scroll', scheduleUpdate, { passive: true });
    window.addEventListener('resize', scheduleUpdate);
    window.addEventListener('load', scheduleUpdate);
    scheduleUpdate();
  })();
</script>
